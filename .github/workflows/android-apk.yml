name: Build Aurelia PMS APK and source ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aurelia-pms-android-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated source zip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify web and Android UI match
        run: cmp index.html android/app/src/main/assets/index.html
      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.external = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inside = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.inside and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.inside:
                      if not self.external:
                          self.parts.append("".join(self.current))
                      self.inside = False
                      self.external = False
          parser = Scripts()
          parser.feed(open("index.html", encoding="utf-8").read())
          if not parser.parts:
              raise SystemExit("No inline JavaScript found in index.html")
          open("/tmp/aurelia-inline.js", "w", encoding="utf-8").write("\n".join(parser.parts))
          PY
          node --check /tmp/aurelia-inline.js
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package source ZIP
        run: |
          mkdir -p dist
          zip -r dist/aurelia-pms-source.zip README.md index.html android .github -x 'android/.gradle/*' 'android/**/build/*' 'dist/*.zip'
      - name: Publish source ZIP to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/aurelia-pms-source.zip
          git commit -m "Publish generated source ZIP [generated source zip]" || exit 0
          git push origin HEAD:main
      - name: Upload APK and source ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/aurelia-pms-source.zip
          if-no-files-found: error
          retention-days: 30
