name: Build Aurelia PMS APK and source ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify web and Android UI match
        run: cmp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Package source ZIP
        run: |
          mkdir -p dist
          zip -r dist/aurelia-pms-source.zip README.md index.html android .github -x 'android/.gradle/*' 'android/**/build/*'
      - name: Upload APK and source ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/aurelia-pms-source.zip
          if-no-files-found: error
          retention-days: 30
