<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b23">
<title>Aurelia — Hotel & Restaurant Management</title>
<style>
:root{--bg:#f5f5f0;--paper:#fff;--ink:#1b2a24;--muted:#7a847d;--green:#173c30;--green2:#285744;--gold:#bd9a55;--line:#e5e8e1;--red:#b7443e;--amber:#a66b17;--shadow:0 12px 34px #1d382012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:var(--green);color:#f5f2e8;padding:24px 15px;display:flex;flex-direction:column;gap:24px}.brand{padding:4px 10px 20px;border-bottom:1px solid #ffffff22}.brand-mark{height:38px;width:38px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;border-radius:12px;font-family:Georgia,serif;font-size:22px}.brand h1{font:24px Georgia,serif;margin:12px 0 2px;letter-spacing:.3px}.brand small{color:#c7d4cb;letter-spacing:1.7px;font-size:9px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#d6e0d8;border:0;text-align:left;padding:12px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.nav .ico{width:20px;text-align:center;color:#d0b475;font-size:16px}.sidefoot{margin-top:auto;color:#c0cec5;font-size:11px;padding:10px}.main{min-width:0}.topbar{height:78px;background:#ffffffdc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--gold);text-transform:uppercase;font-weight:800}.topbar h2{font:24px Georgia,serif;margin:3px 0 0}.topright{display:flex;align-items:center;gap:12px}.pill{background:#edf2ed;border-radius:20px;padding:8px 12px;color:var(--green);font-size:12px}.avatar{height:36px;width:36px;border-radius:50%;background:#e8ddc4;color:#6b552e;display:grid;place-items:center;font-weight:700}.content{padding:28px 30px 60px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.pagehead h3{font:25px Georgia,serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.gold{background:#f5eddc;border-color:#ead9b3;color:#654f24}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:19px;min-width:0}.statlabel{color:var(--muted);font-size:12px}.statvalue{font:30px Georgia,serif;margin:10px 0 4px}.statnote{font-size:11px;color:var(--green2)}.cols{grid-template-columns:1.25fr .75fr}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.cardhead h4{font:19px Georgia,serif;margin:0}.list{display:grid;gap:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowtitle{font-weight:700}.muted{color:var(--muted);font-size:11px;margin-top:3px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800;background:#e8f1eb;color:#276144}.badge.warn{background:#fff1d7;color:#8c5b12}.badge.red{background:#fde9e7;color:#a53b34}.badge.gray{background:#eef0ed;color:#647067}.sectiongrid{grid-template-columns:repeat(3,minmax(0,1fr))}.roomgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.room{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}.roomtop{display:flex;justify-content:space-between;gap:8px}.roomno{font:22px Georgia,serif}.roomtype{font-size:11px;color:var(--muted);margin-top:3px}.roomprice{font-weight:750;margin-top:15px}.roomactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:#fafbf8}tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;font-weight:800;color:#68756d}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe4dc;border-radius:8px;background:#fff;color:var(--ink);outline-color:var(--gold)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{background:#f5efdf;border:1px solid #e9dcb9;color:#6e5729;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:16px}.tablecards{grid-template-columns:repeat(4,minmax(0,1fr))}.dtable{border:1px solid var(--line);border-radius:13px;padding:15px;background:white}.dtable h4{margin:0;font:20px Georgia,serif}.dtable p{font-size:11px;color:var(--muted)}.dtable .btn{width:100%;margin-top:8px}.modalback{position:fixed;inset:0;background:#0d201bc9;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modalback.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{font:24px Georgia,serif;margin:0}.x{border:0;background:#f1f3ef;border-radius:50%;height:32px;width:32px;font-size:18px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.bill{max-width:760px;margin:auto;background:#fff;padding:28px;border:1px solid var(--line);border-radius:14px}.bill h2{font:28px Georgia,serif;margin:0}.bill .total{font:28px Georgia,serif}.hidden{display:none!important}.mobilemenu{display:none}.footnote{font-size:10px;color:var(--muted);margin-top:16px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.roomgrid,.tablecards{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:250px;transform:translateX(-102%);transition:transform .22s;box-shadow:12px 0 40px #0003}.sidebar.open{transform:translateX(0)}.mobilemenu{display:inline-flex}.topbar{height:68px;padding:0 15px}.topbar h2{font-size:20px}.topright .pill{display:none}.content{padding:20px 14px 45px}.pagehead{align-items:flex-start}.pagehead h3{font-size:22px}.stats{gap:10px}.card{padding:15px}.statvalue{font-size:25px}.roomgrid,.tablecards,.sectiongrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.hide-mobile{display:none}.btn{padding:9px 11px}}
@media print{.sidebar,.topbar,.pagehead,.toolbar,.btn,.footnote{display:none!important}.app{display:block}.content{padding:0}.bill{border:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">A</div><h1>Aurelia</h1><small>HOTEL · DINING · STAYS</small></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">◈</span>Overview</button>
<button data-page="rooms"><span class="ico">▦</span>Rooms & stays</button>
<button data-page="guests"><span class="ico">♙</span>Guests</button>
<button data-page="restaurant"><span class="ico">♨</span>Restaurant POS</button>
<button data-page="inventory"><span class="ico">▤</span>Inventory</button>
<button data-page="billing"><span class="ico">₹</span>Invoices & payments</button>
<button data-page="reports"><span class="ico">▥</span>Reports & exports</button>
<button data-page="settings"><span class="ico">⚙</span>Settings</button>
</nav><div class="sidefoot">AURELIA MANAGEMENT SUITE<br><span id="buildLabel">Local-first workspace</span></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menuBtn">☰</button><div><div class="eyebrow">Hospitality management</div><h2 id="pageTitle">Overview</h2></div></div><div class="topright"><span class="pill" id="today"></span><button class="btn gold" id="quickBooking">＋ New booking</button><div class="avatar">A</div></div></header><div class="content" id="content"></div></main></div>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h3 id="modalTitle">New record</h3><button class="x" id="modalClose">×</button></div><div id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div></div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.from((r||document).querySelectorAll(s))};
var money=function(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})},today=new Date().toISOString().slice(0,10);
$('#today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
var initial={
settings:{hotel:'Aurelia Hotel',restaurant:'Aurelia Dining',address:'Coastal Road, Maharashtra',phone:'',gstin:'',upi:'',currency:'INR',tax:5},
rooms:Array.from({length:16},function(_,i){return {id:i+1,no:String(101+i),type:i<4?'Deluxe':i<10?'Premium':'Suite',rate:i<4?2800:i<10?4200:6500,status:i%7===0?'Maintenance':'Available',guestId:null}}),
guests:[],bookings:[],orders:[],inventory:[{id:1,name:'Bath towels',category:'Housekeeping',qty:18,min:8,unit:'pcs',cost:220},{id:2,name:'Shampoo 30ml',category:'Housekeeping',qty:12,min:15,unit:'pcs',cost:18},{id:3,name:'Drinking water 1L',category:'Restaurant',qty:48,min:12,unit:'bottles',cost:20},{id:4,name:'Coffee beans',category:'Restaurant',qty:6,min:4,unit:'kg',cost:620},{id:5,name:'Laundry detergent',category:'Housekeeping',qty:3,min:5,unit:'L',cost:190}],
payments:[],nextId:100
};
var db;try{db=JSON.parse(localStorage.getItem('aurelia.db.v1'))||initial}catch(e){db=initial}
function save(){localStorage.setItem('aurelia.db.v1',JSON.stringify(db));render()}
function id(){db.nextId=(Number(db.nextId)||100)+1;return db.nextId}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function badge(s){var cls=s==='Occupied'||s==='Checked in'||s==='Served'||s==='Paid'?'':s==='Maintenance'||s==='Pending'||s==='Low stock'?'warn':s==='Overdue'||s==='Cancelled'?'red':'gray';return '<span class="badge '+cls+'">'+esc(s)+'</span>'}
function guestName(gid){var g=db.guests.find(function(x){return x.id===gid});return g?g.name:'Walk-in'}
function bookingRoom(bid){var b=db.bookings.find(function(x){return x.id===bid});return b?b.roomNo:'—'}
function balance(b){return Math.max(0,(Number(b.total)||0)-(Number(b.paid)||0))}
function nights(b){var n=Math.ceil((new Date(b.checkout)-new Date(b.checkin))/86400000);return Math.max(1,n||1)}
function totalRoom(){return db.rooms.length}
function occupied(){return db.rooms.filter(function(r){return r.status==='Occupied'}).length}
function stat(label,value,note){return '<div class="card"><div class="statlabel">'+label+'</div><div class="statvalue">'+value+'</div><div class="statnote">'+note+'</div></div>'}
function pagehead(title,sub,action){return '<div class="pagehead"><div><h3>'+title+'</h3><div class="sub">'+sub+'</div></div>'+(action||'')+'</div>'}
function btn(text,action,kind){return '<button class="btn '+(kind||'')+'" data-action="'+action+'">'+text+'</button>'}
function renderDashboard(){var low=db.inventory.filter(function(i){return i.qty<=i.min}),pending=db.bookings.filter(function(b){return b.status!=='Cancelled'&&balance(b)>0}),arrivals=db.bookings.filter(function(b){return b.checkin===today&&b.status==='Reserved'}),recent=db.bookings.slice().sort(function(a,b){return b.id-a.id}).slice(0,5);
return pagehead('Good hospitality starts here.','A live snapshot of your rooms, guests and dining operations.',btn('＋ Add guest','guest-new','primary'))+
'<div class="grid stats">'+stat('ROOMS OCCUPIED',occupied()+' / '+totalRoom(),Math.round(occupied()/Math.max(1,totalRoom())*100)+'% occupancy')+stat('ARRIVALS TODAY',arrivals.length,'Reservations due for check-in')+stat('OUTSTANDING BALANCE',money(pending.reduce(function(s,b){return s+balance(b)},0)),pending.length+' invoices with balance')+stat('LOW-STOCK ALERTS',low.length,low.length?'Replenishment required':'Stock levels healthy')+'</div>'+
'<div class="grid cols"><div class="card"><div class="cardhead"><h4>Recent stays & bookings</h4>'+btn('View all','go-rooms','small')+'</div><div class="list">'+(recent.length?recent.map(function(b){return '<div class="row"><div><div class="rowtitle">'+esc(b.guestName)+'</div><div class="muted">Room '+esc(b.roomNo)+' · '+esc(b.checkin)+' → '+esc(b.checkout)+'</div></div><div style="text-align:right">'+badge(b.status)+'<div class="muted">'+money(b.total)+'</div></div></div>'}).join(''):'<div class="empty">No bookings yet. Add your first reservation.</div>')+'</div></div>'+
'<div class="card"><div class="cardhead"><h4>Housekeeping stock alerts</h4>'+btn('Manage stock','go-inventory','small')+'</div><div class="list">'+(low.length?low.map(function(i){return '<div class="row"><div><div class="rowtitle">'+esc(i.name)+'</div><div class="muted">'+esc(i.category)+' · minimum '+i.min+' '+esc(i.unit)+'</div></div><span class="badge warn">'+i.qty+' left</span></div>'}).join(''):'<div class="empty">No low-stock items.</div>')+'</div></div></div>'+
'<div class="card" style="margin-top:16px"><div class="cardhead"><h4>Room availability</h4>'+btn('Manage rooms','go-rooms','small')+'</div><div class="grid roomgrid">'+db.rooms.slice(0,8).map(roomCard).join('')+'</div></div>'}
function roomCard(r){var b=db.bookings.find(function(x){return x.roomNo===r.no&&x.status==='Checked in'});return '<div class="room"><div class="roomtop"><div><div class="roomno">'+esc(r.no)+'</div><div class="roomtype">'+esc(r.type)+'</div></div>'+badge(r.status)+'</div><div class="roomprice">'+money(r.rate)+' <span class="muted">/ night</span></div>'+(b?'<div class="muted">'+esc(b.guestName)+'</div>':'')+'<div class="roomactions">'+(r.status==='Available'?'<button class="btn small primary" data-action="book-room" data-id="'+r.id+'">Book</button>':'')+(r.status==='Occupied'?'<button class="btn small" data-action="checkout-room" data-id="'+r.id+'">Check out</button>':'')+(r.status==='Maintenance'?'<button class="btn small" data-action="room-available" data-id="'+r.id+'">Mark ready</button>':'')+'</div></div>'}
function renderRooms(){return pagehead('Rooms & stays','Manage room inventory, reservations, check-in and check-out.',btn('＋ New booking','booking-new','primary'))+'<div class="grid stats">'+stat('TOTAL ROOMS',db.rooms.length,'Configured room inventory')+stat('AVAILABLE',db.rooms.filter(function(r){return r.status==='Available'}).length,'Ready to sell')+stat('OCCUPIED',occupied(),'Currently checked in')+stat('MAINTENANCE',db.rooms.filter(function(r){return r.status==='Maintenance'}).length,'Unavailable rooms')+'</div><div class="toolbar"><input id="roomSearch" class="field" style="margin:0;max-width:280px" placeholder="Search room or guest"><select id="roomFilter" class="field" style="margin:0;max-width:190px"><option value="">All statuses</option><option>Available</option><option>Occupied</option><option>Maintenance</option></select></div><div class="grid roomgrid" id="roomGrid">'+db.rooms.map(roomCard).join('')+'</div><h3 style="font:24px Georgia,serif;margin:28px 0 12px">Reservations</h3>'+bookingTable()}
function bookingTable(){return '<div class="tablewrap"><table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Amount</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(db.bookings.length?db.bookings.slice().reverse().map(function(b){return '<tr><td><b>'+esc(b.guestName)+'</b><div class="muted">'+esc(b.phone)+'</div></td><td>'+esc(b.roomNo)+'</td><td>'+esc(b.checkin)+'<div class="muted">to '+esc(b.checkout)+'</div></td><td>'+money(b.total)+'</td><td>'+money(balance(b))+'</td><td>'+badge(b.status)+'</td><td>'+(b.status==='Reserved'?'<button class="btn small primary" data-action="checkin" data-id="'+b.id+'">Check in</button> ':'')+(b.status==='Checked in'?'<button class="btn small" data-action="checkout" data-id="'+b.id+'">Check out</button> ':'')+'<button class="btn small" data-action="invoice" data-id="'+b.id+'">Invoice</button></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No reservations recorded.</td></tr>')+'</tbody></table></div>'}
function renderGuests(){return pagehead('Guest directory','Guest profiles, contact details and ID document references.',btn('＋ Add guest','guest-new','primary'))+'<div class="toolbar"><input id="guestSearch" class="field" style="margin:0;max-width:340px" placeholder="Search name, phone or ID number"></div><div class="tablewrap"><table><thead><tr><th>Guest</th><th>Contact</th><th>ID type / number</th><th>Stays</th><th>Actions</th></tr></thead><tbody>'+(db.guests.length?db.guests.slice().reverse().map(function(g){return '<tr><td><b>'+esc(g.name)+'</b><div class="muted">'+esc(g.email||'')+'</div></td><td>'+esc(g.phone)+'</td><td>'+esc(g.idType||'Not recorded')+'<div class="muted">'+esc(g.idNumber||'')+'</div></td><td>'+db.bookings.filter(function(b){return b.guestId===g.id}).length+'</td><td><button class="btn small" data-action="guest-edit" data-id="'+g.id+'">Edit</button> <button class="btn small" data-action="guest-export" data-id="'+g.id+'">Export</button></td></tr>'}).join(''):'<tr><td colspan="5" class="empty">No guest profiles yet.</td></tr>')+'</tbody></table></div><div class="footnote">ID photos are stored locally in this browser/app profile. For production multi-device operation, configure encrypted server storage and access controls before storing real identity documents.</div>'}
function renderRestaurant(){var open=db.orders.filter(function(o){return o.status!=='Paid'});return pagehead('Restaurant POS','Separate dining ledger for walk-ins and hotel guests. Only explicit room postings enter the hotel folio.',btn('＋ New order','order-new','primary'))+'<div class="notice">Restaurant checks remain separate from hotel invoices. Use “Post to room” only when the guest explicitly requests a room charge.</div><div class="grid stats">'+stat('OPEN CHECKS',open.length,'Unsettled dining orders')+stat('TODAY SALES',money(db.orders.filter(function(o){return o.date===today}).reduce(function(s,o){return s+o.total},0)),'Dining revenue recorded')+stat('ROOM CHARGES',money(db.orders.filter(function(o){return o.postedBookingId}).reduce(function(s,o){return s+o.total},0)),'Explicitly posted to room')+stat('WALK-IN CHECKS',db.orders.filter(function(o){return !o.bookingId}).length,'Restaurant-only guests')+'</div><div class="grid tablecards">'+Array.from({length:8},function(_,i){var t=i+1,o=db.orders.find(function(x){return x.table===t&&x.status!=='Paid'});return '<div class="dtable"><div class="roomtop"><h4>Table '+t+'</h4>'+badge(o?'Occupied':'Available')+'</div><p>'+(o?esc(o.customerName)+' · '+money(o.total):'Ready for service')+'</p>'+(o?'<button class="btn" data-action="order-open" data-id="'+o.id+'">Open check</button>':'<button class="btn primary" data-action="table-new" data-id="'+t+'">Start order</button>')+'</div>'}).join('')+'</div><h3 style="font:24px Georgia,serif;margin:28px 0 12px">Dining checks</h3><div class="tablewrap"><table><thead><tr><th>Check</th><th>Customer</th><th>Table</th><th>Type</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+(db.orders.length?db.orders.slice().reverse().map(function(o){return '<tr><td>#D'+o.id+'</td><td><b>'+esc(o.customerName)+'</b><div class="muted">'+esc(o.phone)+'</div></td><td>'+o.table+'</td><td>'+(o.postedBookingId?'Room charge':o.bookingId?'Hotel guest':'Walk-in')+'</td><td>'+money(o.total)+'</td><td>'+badge(o.status)+'</td><td><button class="btn small" data-action="order-open" data-id="'+o.id+'">View</button> '+(o.status!=='Paid'?'<button class="btn small primary" data-action="order-pay" data-id="'+o.id+'">Settle</button>':'')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No dining checks yet.</td></tr>')+'</tbody></table></div>'}
function renderInventory(){return pagehead('Inventory & housekeeping','Track consumables, minimum stock levels and replenishment.',btn('＋ Add item','stock-new','primary'))+'<div class="grid stats">'+stat('SKU COUNT',db.inventory.length,'Tracked stock items')+stat('LOW STOCK',db.inventory.filter(function(i){return i.qty<=i.min}).length,'At or below reorder level')+stat('STOCK VALUE',money(db.inventory.reduce(function(s,i){return s+i.qty*i.cost},0)),'Estimated cost value')+stat('HOUSEKEEPING ITEMS',db.inventory.filter(function(i){return i.category==='Housekeeping'}).length,'Room operations supplies')+'</div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th>On hand</th><th>Reorder at</th><th>Unit cost</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+db.inventory.map(function(i){return '<tr><td><b>'+esc(i.name)+'</b></td><td>'+esc(i.category)+'</td><td>'+i.qty+' '+esc(i.unit)+'</td><td>'+i.min+'</td><td>'+money(i.cost)+'</td><td>'+(i.qty<=i.min?badge('Low stock'):badge('In stock'))+'</td><td><button class="btn small" data-action="stock-adjust" data-id="'+i.id+'">Adjust</button> <button class="btn small" data-action="stock-edit" data-id="'+i.id+'">Edit</button></td></tr>'}).join('')+'</tbody></table></div>'}
