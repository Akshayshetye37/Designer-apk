openS(`<h2 class="foil">${esc(b.g)}</h2><div class="lab">Folio · Room ${b.room}</div><div style="margin:12px 0">${L.map(x=>`<div class="ln"><span>${esc(x[0])}</span><span>${K(x[1])}</span></div>`).join('')}<div class="ln"><span>Paid</span><span>${K(b.p||0)}</span></div></div><div class="row"><span class="lab">Balance due</span><span class="tot">${K(d)}</span></div>${d>0?`<label class="fld"><span>Payment amount</span><input id="pa" type="number" value="${d}"></label><div class="chips" id="pm">${['Cash','MTN MoMo','Airtel Money','Zamtel','Card','Bank transfer','UPI'].map((p,k)=>`<button class="chip ${k?'':'on'}" onclick="$$('#pm .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${p}</button>`).join('')}</div><label class="fld"><span>Transaction reference</span><input id="pr"></label><label class="fld"><input id="pc" type="checkbox">I checked that the money has arrived</label><button class="btn" style="width:100%" onclick="pay(${i})">Record payment</button>`:''}<div class="row" style="margin:14px 0 0"><input id="cl" placeholder="Extra charge" style="flex:1;padding:11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--ln)"><input id="ca" type="number" placeholder="Amount" style="width:96px;padding:11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--ln)"><button class="btn sm ghost" onclick="addC(${i})">Add</button></div><div class="row" style="margin-top:16px">${on('Invoices')?`<button class="btn ghost sm" onclick="inv(${i})">Invoice</button>`:''}${b.st==='in'?`<button class="btn sm" ${d>0?'style="opacity:.45"':''} onclick="outB(${i})">${d>0?'Settle to check out':'Check out'}</button>`:''}</div>`)}
function pay(i){const b=bk(i),a=+$('#pa').value,d=dueB(b);if(!(a>0)){toast('Enter an amount above zero');return}if(a>d){toast('That is more than the balance of '+K(d));return}if(!$('#pc').checked){toast('Confirm that you received the money');return}const m=$('#pm .on').textContent,r=$('#pr').value.trim();b.p=(b.p||0)+a;S.today+=a;aud('Payment',K(a)+' by '+m+' · Room '+b.room+(r?' · ref '+r:''));render();toast(K(a)+' recorded');folio(i)}
function addC(i){const l=$('#cl').value.trim(),a=+$('#ca').value;if(!l||!(a>0)){toast('Add a label and an amount');return}bk(i).ch.push([l,a]);aud('Charge',l+' · '+K(a));folio(i)}
function outB(i){const b=bk(i);if(dueB(b)>0){toast('Settle '+K(dueB(b))+' before check-out');return}b.st='done';rm(b.room).s='clean';aud('Check-out',b.g+' · Room '+b.room);closeS();render();toast(b.g+' checked out')}
function inv(i){const b=bk(i),L=[[`Room ${b.room} · ${nts(b)} nights`,nts(b)*rm(b.room).r],...b.ch],s=S.set;openS(`<h2 class="foil">${esc(s.name)}</h2><div class="lab">${esc(s.addr)} · ${esc(s.phone)} · ${esc(s.tax)}</div><div style="margin:16px 0"><b>${esc(b.g)}</b><div class="lab">${fd(b.in)} to ${fd(b.out)}</div></div>${L.map(x=>`<div class="ln"><span>${esc(x[0])}</span><span>${K(x[1])}</span></div>`).join('')}<div class="ln"><span>Paid</span><span>${K(b.p||0)}</span></div><div class="row" style="margin-top:10px"><span class="lab">Balance</span><span class="tot">${K(dueB(b))}</span></div><button class="btn" style="width:100%;margin-top:14px" onclick="shr(${i})">Share invoice</button>`)}
async function shr(i){const b=bk(i),t=`${S.set.name} invoice for ${b.g}, room ${b.room}. Total ${K(tt(b))}, paid ${K(b.p||0)}, balance ${K(dueB(b))}.`;try{if(navigator.share)await navigator.share({title:'Invoice',text:t});else{await navigator.clipboard.writeText(t);toast('Invoice summary copied')}}catch(e){toast('Sharing was cancelled')}}
/* More menu and modules */

inv:()=>hd('Inventory')+`<button class="btn sm" onclick="invNew()">Add item</button><div class="grid">${S.inv.map((x,i)=>`<div class="card"><div class="row"><h3>${esc(x.n)}</h3>${x.q<=x.ro?'<span class="tag out">Low stock</span>':''}</div><div class="lab">${x.q} in stock · reorder at ${x.ro} · worth ${K(x.q*x.u)}${x.sellable?' · For sale at '+K(x.price||0):' · Internal stock'}</div><div class="bar"><i style="width:${Math.min(100,x.q/(x.ro*2)*100)}%"></i></div><div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="invOp(${i},1)">Purchase</button><button class="btn sm ghost" onclick="invOp(${i},-1)">Issue</button></div></div>`).join('')}</div><h2 style="margin:20px 0 8px">Ledger</h2><div class="card"><div class="list">${S.led.map(l=>`<div class="item"><div class="f"><b>${esc(l[0])}</b><small>${tmf(l[3])}</small></div><span>${l[1]>0?'+':''}${l[1]}</span></div>`).join('')||'<div class="empty">Purchases and issues appear here.</div>'}</div></div>`,
exp:()=>hd('Expenses')+`<button class="btn sm" onclick="expNew()">Add expense</button><div class="card" style="margin-top:14px"><div class="list">${S.exp.map(e=>`<div class="item" style="${e.v?'opacity:.45;text-decoration:line-through':''}"><div class="f"><b>${esc(e.t)}</b><small>${esc(e.c)}${e.v?' · voided':''}</small></div><span>${K(e.a)}</span>${e.v?'':`<button class="btn sm ghost" onclick="expVoid(${e.id})">Void</button>`}</div>`).join('')}</div></div><div class="row" style="margin-top:12px"><span class="lab">Active total</span><span class="tot">${K(S.exp.filter(e=>!e.v).reduce((a,e)=>a+e.a,0))}</span></div>`,
rep:()=>{const v=[...S.hist,S.today],W=v.reduce((a,b)=>a+b,0),rv=S.b.filter(b=>b.st!=='res').reduce((a,b)=>a+tt(b),0),pd=S.b.reduce((a,b)=>a+(b.p||0),0),os=S.b.filter(b=>b.st==='in').reduce((a,b)=>a+Math.max(0,dueB(b)),0),ex=S.exp.filter(e=>!e.v).reduce((a,e)=>a+e.a,0),mx=Math.max(...v);return hd('Reports')+`<div class="grid g4" style="margin-top:0">${kpi('Week takings',W,'K','','Last seven days')}${kpi('Stay revenue',rv,'K','','Rooms and charges')}${kpi('Payments recorded',pd,'K','','Against folios')}${kpi('Outstanding',os,'K','','In-house balances')}</div><div class="grid g2"><div class="card"><h2>Daily takings</h2>${v.map((x,i)=>`<div class="row lab" style="margin-top:8px"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Today'][i]}</span><span>${K(x)}</span></div><div class="bar"><i style="width:${x/mx*100}%"></i></div>`).join('')}</div><div class="card"><h2>Net position</h2><div class="lab">Week takings less active expenses</div><div class="tot" style="margin:10px 0">${K(W-ex)}</div><div class="lab">Expenses ${K(ex)}. Reconcile with your ledger before filing.</div></div></div>`},
aud:()=>hd('Audit')+`<div class="card"><div class="list">${S.aud.map(a=>`<div class="item"><div class="f"><b>${esc(a.a)}</b><small>${esc(a.d)}</small></div><small class="lab">${tmf(a.at)}</small></div>`).join('')||'<div class="empty">Actions you take will be recorded here.</div>'}</div></div>`,
io:()=>hd('Import and export')+`<div class="grid">${[['Copy full backup (JSON)','json'],['Copy guests (CSV)','guests'],['Copy bookings (CSV)','bookings']].map(([l,k])=>`<div class="card row"><span>${l}</span><button class="btn sm" onclick="cp('${k}')">Copy</button></div>`).join('')}</div><p class="lab" style="margin-top:14px">Encrypted backup and restore, spreadsheet import and saving files to your device run in the Android app. This page copies data to your clipboard instead.</p>`,
set:()=>{const s=S.set,sw=(k,d)=>`<div class="row" style="padding:10px 0;border-bottom:1px dotted var(--ln);${d?'opacity:.4':''}"><span>${k}</span><button class="sw ${S.fe[k]?'on':''}" aria-label="${k}" onclick="tg('${k}')"></button></div>`;return hd('Settings')+`<div class="card"><h2>Hotel identity</h2>${[['name','Business name'],['phone','Phone'],['addr','Address'],['tax','GST or TPIN'],['upi','UPI or mobile money ID'],['cur','Currency']].map(([k,l])=>`<label class="fld"><span>${l}</span><input data-s="${k}" value="${esc(s[k]||'')}"></label>`).join('')}<label class="fld"><span>Hotel logo</span><input type="file" accept="image/*" onchange="pv(this,'lg')"></label><img id="lg" alt="" style="max-height:70px;display:none;border-radius:12px"><label class="fld"><span>Payment QR</span><input type="file" accept="image/*" onchange="pv(this,'qr')"></label><img id="qr" alt="" style="max-height:120px;display:none;border-radius:12px"><button class="btn" style="margin-top:12px" onclick="sv()">Save identity</button></div><div class="card" style="margin-top:14px"><h2>Feature controls</h2>${M.map(k=>sw(k)).join('')}</div>${Object.entries(G).map(([g,c])=>`<div class="card" style="margin-top:14px"><h2>${g}</h2>${sw(g)}${c.map(k=>sw(k,!S.fe[g])).join('')}</div>`).join('')}<div class="card" style="margin-top:14px"><h2>Guest terms</h2><label class="fld"><textarea id="tm">${esc(S.terms)}</textarea></label><div class="row"><button class="btn sm" onclick="S.terms=$('#tm').value;toast('Terms saved')">Save terms</button><button class="btn sm ghost" onclick="navigator.clipboard.writeText(S.terms).then(()=>toast('Terms copied'),()=>toast('Copy was blocked'))">Copy</button></div></div><div class="card" style="margin-top:14px"><h2>Data care</h2><div class="row"><button class="btn sm" onclick="hc()">Run health check</button><button class="btn sm ghost" onclick="demoRm()">Remove demo entries</button><button class="btn sm ghost" onclick="resetAll()">Reset all data</button></div></div>`}};
V.more=()=>(SUB[S.sub]||SUB.menu)();
const _r=render;render=function(){if(S.tab!=='more')S.sub=null;_r()};
function rs(n,s){rm(n).s=s;aud('Room '+n,s==='ready'?'Released to available':s==='clean'?'Marked for cleaning':s);render();toast('Room '+n+' updated')}
function tg(k){S.fe[k]=!S.fe[k];const y=scrollY;render();scrollTo({top:y,behavior:'instant'})}
function pv(e,id){const f=e.files[0];if(!f)return;const i=$('#'+id);i.src=URL.createObjectURL(f);i.style.display='block'}
function sv(){$$('[data-s]').forEach(e=>S.set[e.dataset.s]=e.value);aud('Settings','Hotel identity saved');toast('Identity saved')}
function gopen(i){S.gi=i==null?null:i;S.gd=JSON.parse(JSON.stringify(i==null?{n:'',ph:'',em:'',idt:'NRC',idn:'',occ:[],veh:[]}:S.g[i]));gsheet()}
function gread(){const g=S.gd;g.n=$('#g1').value;g.ph=$('#g2').value;g.em=$('#g3').value;g.idt=$('#g4').value;g.idn=$('#g5').value;g.occ=$$('.oc').map(r=>({n:r.children[0].value,dob:r.children[1].value,rel:r.children[2].value}));g.veh=$$('.vh').map(r=>({reg:r.children[0].value,ty:r.children[1].value}))}
function gadd(k){gread();S.gd[k].push(k==='occ'?{n:'',dob:'',rel:''}:{reg:'',ty:''});gsheet()}
function gsheet(){const g=S.gd,f=(id,l,v,t='text')=>`<label class="fld"><span>${l}</span><input id="${id}" type="${t}" value="${esc(v)}"></label>`,c='style="display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:6px;margin-top:6px"',ip='style="min-width:0;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--ln);color-scheme:dark"';
openS(`<h2 class="foil">${g.n?esc(g.n):'New guest'}</h2>${f('g1','Name',g.n)}${f('g2','Phone',g.ph,'tel')}${f('g3','Email',g.em,'email')}<label class="fld"><span>ID type</span><select id="g4">${['NRC','Passport','Driving licence','Aadhaar','PAN','Voter ID'].map(t=>`<option ${t===g.idt?'selected':''}>${t}</option>`).join('')}</select></label>${f('g5','ID number',g.idn)}<label class="fld"><span>ID photo</span><input type="file" accept="image/*" capture="environment" onchange="pv(this,'gp')"></label><img id="gp" alt="" style="max-height:110px;display:none;border-radius:12px"><div class="lab">Text recognition runs in the Android app. Check every field by hand here.</div><h3 style="margin-top:16px">Occupants</h3>${g.occ.map(o=>`<div class="oc" ${c}><input ${ip} placeholder="Name" value="${esc(o.n)}"><input ${ip} type="date" value="${o.dob}"><input ${ip} placeholder="Relation" value="${esc(o.rel)}"></div>`).join('')}<button class="btn sm ghost" style="margin-top:8px" onclick="gadd('occ')">Add occupant</button><h3 style="margin-top:16px">Vehicles</h3>${g.veh.map(v=>`<div class="vh" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input ${ip} placeholder="Registration" value="${esc(v.reg)}"><input ${ip} placeholder="Type" value="${esc(v.ty)}"></div>`).join('')}<button class="btn sm ghost" style="margin-top:8px" onclick="gadd('veh')">Add vehicle</button>${g.n?`<h3 style="margin-top:16px">History</h3>${S.b.filter(b=>b.g===g.n).map(b=>`<div class="ln"><span>Room ${b.room}</span><span class="lab">${fd(b.in)} to ${fd(b.out)}</span></div>`).join('')||'<div class="lab">No stays yet.</div>'}`:''}<div class="row" style="margin-top:18px">${g.ph?`<a class="btn sm ghost" style="text-decoration:none" href="tel:${esc(g.ph)}">Call</a>`:''}${g.ph&&on('WhatsApp actions')?`<a class="btn sm ghost" style="text-decoration:none" href="https://wa.me/${esc(g.ph.replace(/\D/g,''))}" target="_blank" rel="noopener">Message</a>`:''}<button class="btn sm" onclick="gsave()">Save guest</button></div>`)}
function gsave(){gread();if(!S.gd.n.trim()){toast('Enter the guest’s name');return}if(S.gi==null)S.g.push(S.gd);else S.g[S.gi]=S.gd;aud('Guest saved',S.gd.n);closeS();render();toast('Guest saved')}
function invOp(i,d){const x=S.inv[i];openS(`<h2 class="foil">${d>0?'Purchase':'Issue'} · ${esc(x.n)}</h2><label class="fld"><span>Quantity</span><input id="iq" type="number" min="1" value="1"></label><button class="btn" style="width:100%" onclick="invGo(${i},${d})">Confirm</button>`)}
function invGo(i,d){const x=S.inv[i],q=Math.floor(+$('#iq').value);if(!(q>0)){toast('Enter a quantity');return}if(d<0&&q>x.q){toast('Only '+x.q+' in stock');return}x.q+=d*q;S.led.unshift([x.n,d*q,'',new Date()]);aud('Stock '+(d>0?'purchase':'issue'),x.n+' · '+q);closeS();render();if(d<0&&x.q<=x.ro)toast(x.n+' is low on stock')}
function invNew(){openS(`<h2 class="foil">New stock item</h2><label class="fld"><span>Name</span><input id="n1"></label><label class="fld"><span>Opening quantity</span><input id="n2" type="number" value="10"></label><label class="fld"><span>Reorder level</span><input id="n3" type="number" value="5"></label><label class="fld"><span>Unit cost</span><input id="n4" type="number" value="0"></label><label class="fld"><span>Sell price (optional)</span><input id="n5" type="number" value="0"></label><label class="fld"><span>Available for sale</span><select id="n6"><option value="no">No · stock use only</option><option value="yes">Yes · sell from POS</option></select></label><button class="btn" style="width:100%" onclick="invSaveNew()">Add item</button>`)}
function invSaveNew(){const n=$('#n1').value.trim(),q=Number($('#n2').value),ro=Number($('#n3').value),u=Number($('#n4').value),price=Number($('#n5').value);if(!n||!Number.isFinite(q)||q<0||!Number.isFinite(ro)||ro<0){toast('Enter item name and valid stock counts');return}if(S.inv.some(x=>x.n.toLowerCase()===n.toLowerCase())){toast('That inventory item already exists');return}S.inv.push({n,q,ro,u:Number.isFinite(u)?u:0,price:Number.isFinite(price)?price:0,sellable:$('#n6').value==='yes'});aud('Stock item added',n);closeS();render();toast('Stock item added')}
function expNew(){openS(`<h2 class="foil">New expense</h2><label class="fld"><span>Title</span><input id="e1"></label><label class="fld"><span>Category</span><select id="e2">${['Kitchen','Utilities','Staff','Maintenance','Other'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="fld"><span>Amount</span><input id="e3" type="number"></label><button class="btn" style="width:100%" onclick="expAdd()">Save expense</button>`)}
function expAdd(){const a=+$('#e3').value,t=$('#e1').value.trim();if(!t||!(a>0)){toast('Add a title and an amount');return}S.exp.unshift({id:Date.now(),t,c:$('#e2').value,a,v:0});aud('Expense',t+' · '+K(a));closeS();render()}
function expVoid(i){const e=S.exp.find(x=>x.id===i);e.v=1;aud('Expense voided',e.t+' · '+K(e.a));render();toast('Expense voided')}
function cp(k){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',t=k==='json'?JSON.stringify({guests:S.g,bookings:S.b,rooms:S.rooms,expenses:S.exp,inventory:S.inv,audit:S.aud},null,1):k==='guests'?'name,phone,id type,id number\n'+S.g.map(g=>[g.n,g.ph,g.idt,g.idn].map(q).join(',')).join('\n'):'guest,room,in,out,status,total,paid\n'+S.b.map(b=>[b.g,b.room,fd(b.in),fd(b.out),b.st,tt(b),b.p||0].map(q).join(',')).join('\n');navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard'),()=>toast('Copy was blocked by the browser'))}
function hc(){const names=S.g.map(g=>g.n.toLowerCase()),dup=names.filter((n,i)=>names.indexOf(n)!==i),bad=S.b.filter(b=>!rm(b.room));aud('Health check',dup.length+' duplicates, '+bad.length+' malformed');openS(`<h2 class="foil">Health check</h2>${[['Guests',S.g.length],['Bookings',S.b.length],['Rooms',S.rooms.length],['Expenses',S.exp.length],['Inventory',S.inv.length],['Audit entries',S.aud.length]].map(x=>`<div class="ln"><span>${x[0]}</span><span class="ready">${x[1]} found</span></div>`).join('')}<div class="ln"><span>Duplicate guests</span><span class="${dup.length?'out':'ready'}">${dup.length?dup.join(', '):'None'}</span></div><div class="ln"><span>Bookings with a missing room</span><span class="${bad.length?'out':'ready'}">${bad.length||'None'}</span></div><p class="lab">Nothing is merged or deleted automatically. Duplicates stay for you to review.</p>`)}
function demoRm(){openS(`<h2 class="foil">Remove demo entries</h2><p class="lab">This removes the sample expenses and the sample order on table 3. Real guests, bookings and payments stay as they are.</p><button class="btn" style="width:100%" onclick="S.exp=S.exp.filter(e=>!e.demo);S.t[2].o=[];aud('Demo entries removed','Sample expenses and orders');closeS();render();toast('Demo entries removed')">Remove demo entries</button>`)}

const nat=o=>{try{if(window.AureliaNative){AureliaNative.postMessage(JSON.stringify(o));return true}}catch(e){}return false};
const ymd=n=>{const d=D(n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const offOf=s=>{const a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-a)/864e5)};
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return Math.round(d/864e5)};
const shrink=(f,cb)=>{if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)};

window.__aureliaOcrTargets=window.__aureliaOcrTargets||{};
function parseIdOcrText(raw){
 const text=String(raw||'').replace(/\r/g,'');
 const lines=text.split(/\n+/).map(x=>x.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const excluded=/GOVERNMENT|REPUBLIC|AUTHORITY|IDENTITY|NATIONAL|PASSPORT|DRIVING|LICEN[CS]E|DATE OF BIRTH|\bDOB\b|\bMALE\b|\bFEMALE\b|ADDRESS|INDIA|INDIAN|ELECTION COMMISSION|UNIQUE IDENTIFICATION|AADHAAR|AADHAR|SIGNATURE|VALID/i;
 const label=/^(?:full\s*name|name|surname|given\s*names?|holder\s*name)\s*[:：.-]?\s*/i;
 let name='';
 for(let i=0;i<lines.length;i++){
  if(label.test(lines[i])){
   const inline=lines[i].replace(label,'').trim();
   if(inline&&!excluded.test(inline)&&!/\d/.test(inline)&&inline.split(/\s+/).length>=2){name=inline;break}
   const next=lines.slice(i+1,i+3).find(x=>/^[A-Z][A-Z ,.'-]{3,}$/i.test(x)&&!excluded.test(x)&&!/\d/.test(x));
   if(next){name=next;break}
  }
 }
 if(!name){
  const candidates=lines.filter(x=>/^[A-Z][A-Z ,.'-]{5,}$/i.test(x)&&!excluded.test(x)&&!label.test(x)&&!/(DOB|DATE|BIRTH|S\/O|D\/O|W\/O|C\/O)/i.test(x)&&!/[0-9]/.test(x)&&x.split(/\s+/).length>=2);
  candidates.sort((a,b)=>{const score=s=>((s.match(/\s/g)||[]).length*3)+Math.min(s.length,40)-(excluded.test(s)?100:0);return score(b)-score(a)});
  if(candidates.length)name=candidates[0];
 }
 const idCandidates=[];
 for(const line of lines){
  if(/DATE OF BIRTH|\bDOB\b|PHONE|MOBILE|PIN CODE|POSTAL|ADDRESS|ISSUE DATE|EXPIRY|VALID FROM/i.test(line))continue;
  for(const match of line.match(/[A-Z0-9][A-Z0-9/-]{4,}/ig)||[]){
   const value=match.replace(/[^A-Z0-9/-]/ig,'');
   if(/\d/.test(value)&&value.length>=5&&!excluded.test(value))idCandidates.push(value);
  }
 }
 idCandidates.sort((a,b)=>b.length-a.length);
 return {name:name.replace(/\s+/g,' ').trim(),id:idCandidates[0]||'',text:lines.join('\n')};
}

/* Targeted reliability fixes: ID OCR field routing, Android-safe exports, dynamic UPI QR. */
function parseIdOcrText(raw){
 const text=String(raw||'').replace(/\r/g,'');
 const lines=text.split('\n').map(v=>v.trim()).filter(Boolean);
 const excluded=/GOVERNMENT|REPUBLIC|AUTHORITY|IDENTITY|NATIONAL|PASSPORT|DRIVING|LICEN[CS]E|DATE OF BIRTH|DOB|MALE|FEMALE|ADDRESS|INDIA|INDIAN/i;
 const labelLine=lines.find(v=>/^(?:full\s*name|name|surname|given\s*names?)\s*[:.-]?\s*\S/i.test(v));
 let name=labelLine?labelLine.replace(/^(?:full\s*name|name|surname|given\s*names?)\s*[:.-]?\s*/i,'').trim():'';
 if(!name){const candidate=lines.find(v=>/^[A-Z][A-Z ,.'-]{4,}$/.test(v)&&!excluded.test(v)&&! /\d/.test(v));if(candidate)name=candidate.trim();}
 const candidates=[];
 for(const line of lines){if(/DOB|DATE OF BIRTH|PHONE|MOBILE|PIN|POSTAL|ADDRESS/i.test(line))continue;for(const value of (line.match(/[A-Z0-9][A-Z0-9/-]{4,}/ig)||[])){const v=value.replace(/[^A-Z0-9/-]/ig,'');if(/\d/.test(v)&&v.length>=5&&!excluded.test(v))candidates.push(v);}}
 candidates.sort((a,b)=>b.length-a.length);
 return {name,id:candidates[0]||'',text:lines.join('\n')};
}
async function ocrUploadedId(file,target){

function importXlsxFile(input){
 const file=input.files&&input.files[0];if(!file)return;
 const run=async()=>{
  if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  let rows=[],sheetName='';
  for(const sn of wb.SheetNames){const candidate=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:true});if(candidate.length){rows=candidate;sheetName=sn;break}}
  if(!rows.length)throw new Error('No data rows found in any worksheet.');
  const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const aliases={
   guest:['guest','guestname','fullname','name','customer','customername','primaryguest','clientname','occupant'],
   room:['room','roomno','roomnumber','roomname','suite','suiteno','unit','accommodation'],
   arrival:['checkin','checkindate','arrival','arrivaldate','fromdate','startdate','datein','indate'],
   departure:['checkout','checkoutdate','departure','departuredate','todate','enddate','dateout','outdate'],
   checkInTime:['checkintime','arrival time','arrival time','timein','checkintimein'],
   checkOutTime:['checkouttime','departuretime','timeout','checkouttimeout'],
   phone:['phone','phonenumber','mobile','contact','contactnumber','guestphone'],
   email:['email','emailaddress','guestemail'],
   idType:['idtype','documenttype','identitytype','doctype'],
   idNumber:['idnumber','documentnumber','identitynumber','idno','documentid'],
   status:['status','bookingstatus','staystatus']
  };
  const headers=Object.keys(rows[0]),headerMap={};
  for(const field of Object.keys(aliases)){
   const set=aliases[field].map(norm);
   headerMap[field]=headers.find(h=>set.includes(norm(h)))||'';
  }
  const get=(row,field)=>headerMap[field]?row[headerMap[field]]:'';
  const dateOffset=v=>{
   if(v instanceof Date)return Math.round((new Date(v.getFullYear(),v.getMonth(),v.getDate(),12)-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12))/86400000);
   if(typeof v==='number'&&XLSX.SSF.parse_date_code){const d=XLSX.SSF.parse_date_code(v);if(d)return Math.round((new Date(d.y,d.m-1,d.d,12)-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12))/86400000)}
   const s=String(v??'').trim();if(!s)return null;
   let m=s.match(/^(\\d{1,2})[./-](\\d{1,2})[./-](\\d{2,4})$/);
   if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a>12?new Date(y,b-1,a,12):b>12?new Date(y,a-1,b,12):new Date(y,b-1,a,12);if(!isNaN(+d))return Math.round((d-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12))/86400000)}
   const d=new Date(s);return isNaN(+d)?null:Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12))/86400000);
  };
  const timeVal=(v,fallback)=>{if(v instanceof Date)return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');if(typeof v==='number'&&v>=0&&v<1){let m=Math.round(v*1440);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}const s=String(v??'').trim();if(!s)return fallback;const m=s.match(/(\\d{1,2})[:.](\\d{2})\\s*(am|pm)?/i);if(!m)return fallback;let h=+m[1],mi=+m[2];if(m[3]){if(m[3].toLowerCase()==='pm'&&h<12)h+=12;if(m[3].toLowerCase()==='am'&&h===12)h=0}return h<24&&mi<60?String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'):fallback};
  const candidates=rows.map(row=>{
   const guest=String(get(row,'guest')??'').trim(),room=String(get(row,'room')??'').trim();
   const inn=dateOffset(get(row,'arrival')),out=dateOffset(get(row,'departure'));
   return {g:guest,room,inn,out,checkInTime:timeVal(get(row,'checkInTime'),'14:00'),checkOutTime:timeVal(get(row,'checkOutTime'),'11:00'),phone:String(get(row,'phone')??'').trim(),email:String(get(row,'email')??'').trim(),idType:String(get(row,'idType')??'').trim(),idNumber:String(get(row,'idNumber')??'').trim(),st:String(get(row,'status')??'').trim().toLowerCase()};
  }).filter(x=>x.g&&x.room&&x.inn!==null&&x.out!==null&&x.out>x.inn);
  if(!headerMap.guest||!headerMap.room||!headerMap.arrival||!headerMap.departure) {
   const mapSummary=Object.entries(headerMap).filter(([k,v])=>v).map(([k,v])=>k+' ← '+v).join('\\n')||'No known headers matched.';
   openS('<h3>Excel header mapping</h3><p class="lab">Sheet: '+esc(sheetName)+'. I could not identify all required reservation columns. Recognised mappings:</p><pre style="white-space:pre-wrap">'+esc(mapSummary)+'</pre><p class="lab">Expected headers include Guest Name, Room No., Check-in Date and Check-out Date. Rename your columns or upload a sheet with these fields.</p><button class="btn ghost" onclick="closeS()">Close</button>');
   return;
  }
  if(!candidates.length)throw new Error('Headers were recognised, but no valid rows had a guest, room and check-out date after check-in.');
  window._aureliaPendingXlsx=candidates;
  const mapping=Object.entries(headerMap).filter(([k,v])=>v).map(([k,v])=>'<div class="ln"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>').join('');
  const preview=candidates.slice(0,8).map((x,n)=>'<tr><td>'+(n+1)+'</td><td>'+esc(x.g)+'</td><td>'+esc(x.room)+'</td><td>'+esc(String(x.inn))+' → '+esc(String(x.out))+'</td><td>'+esc(x.checkInTime+' / '+x.checkOutTime)+'</td></tr>').join('');
  openS('<h3>Confirm Excel import</h3><p class="lab">Worksheet: '+esc(sheetName)+' · '+candidates.length+' valid reservation rows. Recognised headers are mapped below. Date values are converted to app dates; check-in/out times use spreadsheet values or 14:00 / 11:00 defaults when absent.</p>'+mapping+'<div style="overflow:auto;max-height:34vh"><table><thead><tr><th>#</th><th>Guest</th><th>Room</th><th>Dates (offset)</th><th>In / out time</th></tr></thead><tbody>'+preview+'</tbody></table></div><button class="btn" onclick="commitXlsxImport(window._aureliaPendingXlsx||[])">Import reservations</button> <button class="btn ghost" onclick="window._aureliaPendingXlsx=null;closeS()">Cancel</button>');
 };
 run().catch(e=>{console.error(e);toast('Excel import failed: '+(e.message||'Check the file format or internet connection.'))}).finally(()=>{input.value=''});
}
function commitXlsxImport(rows){
 let added=0,skipped=0;
 rows.forEach(x=>{
  const room=rm(x.room);if(!room){skipped++;return}
  if(S.b.some(b=>String(b.g||'').toLowerCase()===x.g.toLowerCase()&&String(b.room)===x.room&&b.in===x.inn&&b.out===x.out)){skipped++;return}
  const b={id:++id,g:x.g,room:x.room,in:x.inn,out:x.out,st:x.st==='in'||(x.inn<=0&&x.out>0)?'in':'res',ch:[],p:0,pays:[],oc:[],veh:[],checkInTime:x.checkInTime||'14:00',checkOutTime:x.checkOutTime||'11:00',scheduledCheckIn:ymd(x.inn)+'T'+(x.checkInTime||'14:00'),scheduledCheckOut:ymd(x.out)+'T'+(x.checkOutTime||'11:00')};
  if(x.phone)b.ph=x.phone;if(x.email)b.email=x.email;if(x.idType)b.idt=x.idType;if(x.idNumber)b.idn=x.idNumber;
  S.b.push(b);added++;
 });
 window._aureliaPendingXlsx=null;persist();render();closeS();toast('Excel import: '+added+' added, '+skipped+' skipped (room must exist).');
}
